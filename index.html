<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Tap Target</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #3a86ff, #8338ec);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      width: min(95vw, 430px);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      text-align: center;
      margin-top: 0;
      opacity: 0.95;
    }

    .info {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      margin: 12px 0 16px;
      font-weight: bold;
    }

    #startBtn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #ffd166;
      color: #222;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    #arena {
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 300px;
      max-height: 420px;
      background: #f8f9fa;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.35);
    }

    #target {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ef476f;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      user-select: none;
      touch-action: manipulation;
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      padding: 20px;
      pointer-events: none;
    }

    .small {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tap Target</h1>
    <p>Sentuh target merah sebanyak mungkin sebelum waktu habis.</p>

    <div class="info">
      <div>Skor: <span id="score">0</span></div>
      <div>Waktu: <span id="time">20</span>d</div>
    </div>

    <button id="startBtn">Mulai Game</button>

    <div id="arena">
      <div id="target">🎯</div>
      <div id="message">Tekan "Mulai Game"</div>
    </div>

    <div class="small">Cocok dimainkan di HP Android lewat Chrome</div>
  </div>

  <script>
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const startBtn = document.getElementById("startBtn");
    const arena = document.getElementById("arena");
    const target = document.getElementById("target");
    const message = document.getElementById("message");

    let score = 0;
    let timeLeft = 20;
    let timer = null;
    let running = false;

    function updateInfo() {
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
    }

    function moveTarget() {
      const targetSize = 72;
      const maxX = arena.clientWidth - targetSize;
      const maxY = arena.clientHeight - targetSize;

      const x = Math.floor(Math.random() * Math.max(maxX, 1));
      const y = Math.floor(Math.random() * Math.max(maxY, 1));

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function startGame() {
      score = 0;
      timeLeft = 20;
      running = true;
      updateInfo();

      startBtn.disabled = true;
      startBtn.textContent = "Game Berjalan...";
      target.style.display = "flex";
      message.textContent = "";

      moveTarget();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        updateInfo();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      running = false;
      clearInterval(timer);
      target.style.display = "none";
      startBtn.disabled = false;
      startBtn.textContent = "Main Lagi";
      message.innerHTML = "Waktu habis!<br>Skor kamu: " + score;
    }

    startBtn.addEventListener("click", startGame);

    target.addEventListener("pointerdown", () => {
      if (!running) return;
      score++;
      updateInfo();
      moveTarget();
    });

    window.addEventListener("resize", () => {
      if (running) moveTarget();
    });

    updateInfo();
  </script>
</body>
</html>
